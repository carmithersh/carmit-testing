name: CI Policy Evaluation

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: 'JFrog project key'
        required: true
        default: 'pr-review'
      rbv2_name:
        description: 'Release bundle v2 name'
        required: true
        default: 'rbv2-demo'
      rbv2_version:
        description: 'Release bundle version'
        required: true
        default: '1.0.2'

permissions:
  id-token: write
  contents: read

jobs:
  evaluate-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JFrog CLI
        id: setup-cli
        uses: jfrog/setup-jfrog-cli@v4.9.1
        env: 
          JF_URL: https://${{ vars.CTOA_JF_URL }}/
          JF_PROJECT: pr-review
        with:
          oidc-provider-name: github-carmit-project-1

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Fetch release bundle evidence
        env:
          PROJECT_KEY: ${{ inputs.project_key }}
          RBV2_NAME: ${{ inputs.rbv2_name }}
          RBV2_VERSION: ${{ inputs.rbv2_version }}
        run: |
          jf evd get-evidence \
            --release-bundle "${RBV2_NAME}" \
            --release-bundle-version "${RBV2_VERSION}" \
            --project "${PROJECT_KEY}" > rbv2_evidence_raw.json
          echo "Fetched release bundle evidence metadata"
      - name: Print release bundle evidence
        run: |
          cat rbv2_evidence_raw.json

      - name: Validate all pre-merge commits have approval evidence
        run: |
          RESULT=$(opa eval -i rbv2_evidence_raw.json -d .github/policies/pr-policy.rego "data.pr.policy" --format json)
          echo "OPA Result: $RESULT"

          ALLOW=$(echo "$RESULT" | jq -r '.result[0].expressions[0].value.allow')
          MESSAGE=$(echo "$RESULT" | jq -r '.result[0].expressions[0].value.message // "No message"')
          MISSING=$(echo "$RESULT" | jq -r '.result[0].expressions[0].value.missing // []')

          echo "OPA Result: allow=$ALLOW, message=$MESSAGE"

          if [ "$ALLOW" != "true" ]; then
            echo "::error::Evidence policy check failed: $MESSAGE"
            echo "Missing evidence types: $MISSING"
            exit 1
          fi

          echo "Evidence policy check passed"
