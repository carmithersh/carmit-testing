name: ctoa_evd_test
on:
    workflow_dispatch: 
      inputs:
        package-repo-name:
          description: 'Package repository name'
          required: true
          default: 'carmit-docker-local'
        package-name:
          description: 'Package name'
          required: true
          default: 'skills-jfrog-testing'
        package-version:
          description: 'Package version'
          required: true
          default: '44'
        project:
          description: 'Project'
          required: true
          default: 'carmit'
        digest:
          description: 'Digest'
          required: true
          default: 'sha256:b6b65fe935b15ed37c745953a79b8e83ffafca43f62145feb515bb265e2deb68'
        gitCommit:
          description: 'Git commit'
          required: true
          default: '123451c6f6204f91026caf54faf3bfd0227d0ce4897647890'
permissions:
  actions: read # for detecting the Github Actions environment.
  id-token: write # for creating OIDC tokens for signing.
  packages: write # for uploading attestations.
  contents: read
  attestations: write  
jobs:
    create-evd:        
        runs-on: self-hosted
        env:
          PACKAGE_REPO_NAME: ${{ inputs.package-repo-name }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          PACKAGE_VERSION: ${{ inputs.package-version }}
          PROJECT: ${{ inputs.project }}
        steps:
            - name: Checkout the repository    
              uses: actions/checkout@v4
              
            - name: Setup JFrog CLI
              id: setup-cli
              uses: jfrog/setup-jfrog-cli@v5.2.0
              env: 
                JF_URL: https://${{ vars.JF_URL }}/
                JF_PROJECT: carmit
              with:
                  oidc-provider-name: github-carmit-project-1
       
          

            - name: Create sonar evidence
              if: false    
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_REPORT_TASK_FILE: ${{ github.workspace }}/examples/sonar-scan/.scannerwork/report-task.txt
                
              run: |
                # Attach evidence onto docker package using JFrog CLI                
                jf evd create \
                --integration sonar \
                --package-repo-name  "carmit-docker-local"  \
                --package-name "skills-jfrog-testing" \
                --package-version "${{ github.run_number }}" \
                --project "carmit" \
                --key-alias "${{ vars.EVIDENCE_PUBLIC_KEY_ALIAS }}" 

            - name: Create predicate file
              env:
                GIT_COMMIT: ${{ inputs.gitCommit }}
              run: |
                echo '{"content": "gitTest", "verdict": "OK"}' > predicate.json
            - name: Attest generic
              uses: actions/attest@v4
              with:
                subject-name: "gitCommit://${{ inputs.gitCommit }}"
                subject-digest: "sha256:${{ inputs.gitCommit }}"
                predicate-type: "https://jfrog.com/commit-predicate/v1"
                predicate-path: predicate.json
            
            - name: Write signing key to file
              env: 
                EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
              run: |                
                ( umask 077; printf '%s\n' "$EVIDENCE_SIGNING_KEY" > evidence-signing-key.pem )                
            
            - name: read runner temp file created_attestation_paths.txt from RUNNER_TEMP and print it
              run: |
                cat $RUNNER_TEMP/created_attestation_paths.txt
                echo "created_attestation_paths.txt content: ${{ env.CREATED_ATTESTATION_PATHS }}"
            - name: read content of created_attestation_paths.txt and print each line 
              run: |
                cat $RUNNER_TEMP/created_attestation_paths.txt | while read line; do
                  attestation_path=$line
                  echo "line: $line"
                  echo "attestation path: $attestation_path"
                  # print attestation path content
                  cat $attestation_path
                done
                

            - name: Upload evidence
              if: false
              env: 
                EVIDENCE_PUBLIC_KEY_ALIAS: ${{ vars.EVIDENCE_PUBLIC_KEY_ALIAS }}
                GIT_COMMIT: ${{ inputs.gitCommit }}
              run: |
                jf evd create \
                --entity-type "gitCommit" \
                --entity-id "${{ env.GIT_COMMIT }}" \
                --predicate predicate.json \
                --predicate-type https://jfrog.com/predicate/v1 \
                --key ./evidence-signing-key.pem \
                --key-alias "${{ env.EVIDENCE_PUBLIC_KEY_ALIAS }}" \
                --provider-id "github-actions"
              